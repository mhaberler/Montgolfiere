# Signed builds of the Montgolfiere Capacitor app.
#
# - tag v<semver>: signed IPA (uploaded to TestFlight), AAB (uploaded to the
#   Play internal track as a draft), APK + AAB + IPA attached to a GitHub
#   Release for the tag
# - workflow_dispatch: the same builds as workflow artifacts, no uploads
#
# Secrets are set by scripts/sync-app-secrets.sh. iOS signing uses Xcode's
# automatic (cloud-managed) signing with an App Store Connect API key — no
# certificates or profiles are stored anywhere. See BUILD.md.

name: app-release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      name: ${{ steps.v.outputs.name }}
      code: ${{ steps.v.outputs.code }}
    steps:
      - uses: actions/checkout@v7
      - id: v
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            name="${GITHUB_REF#refs/tags/v}"
          else
            name="$(jq -r .version package.json)"
          fi
          # Earlier releases reached versionCode 123 (Android) / build 122 (iOS),
          # and Play/App Store Connect reject a non-increasing code — offset past it.
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "code=$(( ${{ github.run_number }} + 200 ))" >> "$GITHUB_OUTPUT"

  android:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - name: Vite build env
        env:
          VITE_OPENAIP_KEY: ${{ secrets.VITE_OPENAIP_KEY }}
          VITE_MQTT_BROKER_URL: ${{ secrets.VITE_MQTT_BROKER_URL }}
          VITE_MQTT_BROKER_USER: ${{ secrets.VITE_MQTT_BROKER_USER }}
          VITE_MQTT_BROKER_PASSWORD: ${{ secrets.VITE_MQTT_BROKER_PASSWORD }}
          VITE_MQTT_BROKER_PORT: ${{ secrets.VITE_MQTT_BROKER_PORT }}
        run: |
          [[ -n "$VITE_OPENAIP_KEY" ]] || { echo "::error::VITE_* secrets missing — run scripts/sync-app-secrets.sh --vite-only"; exit 1; }
          for v in VITE_OPENAIP_KEY VITE_MQTT_BROKER_URL VITE_MQTT_BROKER_USER VITE_MQTT_BROKER_PASSWORD VITE_MQTT_BROKER_PORT; do
            printf '%s=%s\n' "$v" "${!v}" >> .env.production
          done
      - name: Web build + cap sync
        run: |
          bun install
          bunx vite build --mode production
          bunx cap sync android
      - name: Keystore
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [[ -z "$KS" || -z "$KS_PASS" || -z "$KS_ALIAS" || -z "$KEY_PASS" ]]; then
            echo "::error::ANDROID_* secrets missing — run scripts/sync-app-secrets.sh --android-only"; exit 1
          fi
          echo "$KS" | base64 -d > "$RUNNER_TEMP/release.keystore"
      - name: Build signed APK + AAB
        working-directory: android
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          # android/gradle.properties pins a local Homebrew JDK; use the runner's.
          ./gradlew --no-daemon -Dorg.gradle.java.home="$JAVA_HOME" assembleRelease bundleRelease \
            -PversionCode=${{ needs.version.outputs.code }} \
            -PversionName=${{ needs.version.outputs.name }}
          mkdir -p "$RUNNER_TEMP/out"
          cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/out/montgolfiere-${{ needs.version.outputs.name }}.apk"
          cp app/build/outputs/bundle/release/app-release.aab "$RUNNER_TEMP/out/montgolfiere-${{ needs.version.outputs.name }}.aab"
      - uses: actions/upload-artifact@v7
        with:
          name: android
          path: ${{ runner.temp }}/out/*

  play:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [version, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: android
          path: out
      - name: Service account
        env:
          SA: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          if [[ -z "$SA" ]]; then
            echo "::error::GOOGLE_PLAY_SERVICE_ACCOUNT_JSON missing — run scripts/sync-app-secrets.sh --play-only"; exit 1
          fi
      - name: Upload AAB to Play internal track
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.haberler.montgolfiere
          releaseFiles: out/montgolfiere-${{ needs.version.outputs.name }}.aab
          tracks: internal
          status: draft

  ios:
    needs: version
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - name: Select newest Xcode
        run: |
          xc="$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"
          sudo xcode-select -s "$xc"
          xcodebuild -version
      - name: Vite build env
        env:
          VITE_OPENAIP_KEY: ${{ secrets.VITE_OPENAIP_KEY }}
          VITE_MQTT_BROKER_URL: ${{ secrets.VITE_MQTT_BROKER_URL }}
          VITE_MQTT_BROKER_USER: ${{ secrets.VITE_MQTT_BROKER_USER }}
          VITE_MQTT_BROKER_PASSWORD: ${{ secrets.VITE_MQTT_BROKER_PASSWORD }}
          VITE_MQTT_BROKER_PORT: ${{ secrets.VITE_MQTT_BROKER_PORT }}
        run: |
          [[ -n "$VITE_OPENAIP_KEY" ]] || { echo "::error::VITE_* secrets missing — run scripts/sync-app-secrets.sh --vite-only"; exit 1; }
          for v in VITE_OPENAIP_KEY VITE_MQTT_BROKER_URL VITE_MQTT_BROKER_USER VITE_MQTT_BROKER_PASSWORD VITE_MQTT_BROKER_PORT; do
            printf '%s=%s\n' "$v" "${!v}" >> .env.production
          done
      # Plugins are still on CocoaPods (3 lack a Package.swift), so cap sync runs
      # pod install and the archive is built from the workspace.
      - name: Web build + cap sync
        run: |
          bun install
          bunx vite build --mode production
          bunx cap sync ios
      - name: App Store Connect API key
        env:
          P8: ${{ secrets.ASC_KEY_P8 }}
          KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ISSUER: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          if [[ -z "$P8" || -z "$KEY_ID" || -z "$ISSUER" ]]; then
            echo "::error::ASC_* secrets missing — run scripts/sync-app-secrets.sh --ios-only"; exit 1
          fi
          mkdir -p "$RUNNER_TEMP/asc"
          # Apple's tools expect the downloaded key's name, AuthKey_<KEY_ID>.p8.
          key="$RUNNER_TEMP/asc/AuthKey_$KEY_ID.p8"
          echo "$P8" | base64 -d > "$key"
          if ! grep -q -- '-----BEGIN PRIVATE KEY-----' "$key"; then
            echo "::error::ASC_KEY_P8 does not decode to a .p8 private key (check ASC_KEY_PATH, re-run scripts/sync-app-secrets.sh)"; exit 1
          fi
          echo "ASC_KEY_FILE=$key" >> "$GITHUB_ENV"
      # The archive is built unsigned; signing happens at export, where
      # -allowProvisioningUpdates + the API key lets Xcode fetch the profile and
      # use the cloud-managed distribution certificate.
      - name: Archive (unsigned)
        run: |
          xcodebuild archive \
            -workspace ios/App/App.xcworkspace -scheme App -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            MARKETING_VERSION=${{ needs.version.outputs.name }} \
            CURRENT_PROJECT_VERSION=${{ needs.version.outputs.code }} \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""
      - name: Export signed IPA
        run: |
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist ci/ExportOptions-export.plist \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_FILE" \
            -authenticationKeyID "${{ secrets.ASC_KEY_ID }}" \
            -authenticationKeyIssuerID "${{ secrets.ASC_ISSUER_ID }}"
          mkdir -p "$RUNNER_TEMP/out"
          cp "$RUNNER_TEMP"/export/*.ipa "$RUNNER_TEMP/out/montgolfiere-${{ needs.version.outputs.name }}.ipa"
      - name: Upload to TestFlight
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist ci/ExportOptions-upload.plist \
            -exportPath "$RUNNER_TEMP/upload" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_FILE" \
            -authenticationKeyID "${{ secrets.ASC_KEY_ID }}" \
            -authenticationKeyIssuerID "${{ secrets.ASC_ISSUER_ID }}"
      - uses: actions/upload-artifact@v7
        with:
          name: ios
          path: ${{ runner.temp }}/out/*

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [version, android, ios]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: out
          merge-multiple: true
      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" out/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "Montgolfiere ${{ needs.version.outputs.name }}" \
            --notes "Signed builds of Montgolfiere. IPA: App Store Connect distribution (also uploaded to TestFlight). APK: sideload. AAB: Play internal track (draft)."
